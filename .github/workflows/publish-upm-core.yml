# Publishes com.yohash.propulsion.core (the Burst-compatible math core) to the `upm-core`
# branch, tagged core-vX.Y.Z. The publishing logic lives in publish-upm-package.yml.
#
# Install with:
#     https://github.com/yohash/Propulsion.git#upm-core        (latest)
#     https://github.com/yohash/Propulsion.git#core-vX.Y.Z     (pinned)

name: Publish UPM (com.yohash.propulsion.core)

on:
  push:
    branches:
      - main
    paths:
      - 'Packages/com.yohash.propulsion.core/package.json'
      - 'Packages/com.yohash.propulsion.core/CHANGELOG.md'
  workflow_dispatch:

jobs:
  publish:
    # a manual run from any other branch must never publish
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-upm-package.yml
    with:
      package-dir: Packages/com.yohash.propulsion.core
      upm-branch: upm-core
      tag-prefix: core-v
      display-name: Propulsion Core
