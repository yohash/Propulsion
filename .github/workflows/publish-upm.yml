# Publishes the Unity package to the `upm` branch, and tags it, whenever main
# contains a package version that has not been published yet.
#
# A version is "published" once its tag (vX.Y.Z) exists. A version is ready to
# publish once its CHANGELOG entry has a release date:
#     ## [X.Y.Z] - YYYY-MM-DD
# While the entry still reads "Unreleased", the run skips with a warning; dating
# the entry (which touches CHANGELOG.md) triggers the publish.
#
# Install a published version with:
#     https://github.com/yohash/Propulsion.git#upm      (latest)
#     https://github.com/yohash/Propulsion.git#vX.Y.Z   (pinned)

name: Publish UPM

on:
  push:
    branches:
      - main
    paths:
      - 'Assets/Propulsion/package.json'
      - 'Assets/Propulsion/CHANGELOG.md'
  workflow_dispatch:

concurrency:
  group: publish-upm
  cancel-in-progress: false

env:
  PACKAGE_DIR: Assets/Propulsion

jobs:
  publish:
    # a manual run from any other branch must never publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(jq -er .version "$PACKAGE_DIR/package.json")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=$PACKAGE_DIR/package.json::version '$VERSION' is not a semantic version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published
        id: tag_check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG is already published; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the CHANGELOG entry is dated
        id: changelog
        if: steps.tag_check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CHANGELOG="$PACKAGE_DIR/CHANGELOG.md"
          ESCAPED=${VERSION//./\\.}
          if grep -Eq "^## \[$ESCAPED\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" "$CHANGELOG"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq "^## \[$ESCAPED\]" "$CHANGELOG"; then
            echo "::warning file=$CHANGELOG::$VERSION is not published yet: its CHANGELOG entry has no release date. Replace 'Unreleased' with the date (YYYY-MM-DD) to publish it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error file=$CHANGELOG::package.json is at $VERSION, but CHANGELOG.md has no '## [$VERSION]' entry."
            exit 1
          fi

      - name: Configure git identity
        if: steps.changelog.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Split subtree and update upm branch
        if: steps.changelog.outputs.ready == 'true'
        run: |
          git subtree split --prefix="$PACKAGE_DIR" --branch upm
          # Splits are deterministic, so upm only ever fast-forwards. If this push is
          # rejected, upm has diverged from main's history: investigate rather than
          # force-pushing over what users install from.
          git push origin upm

      - name: Tag upm branch and push
        if: steps.changelog.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag -a "$TAG" upm -m "Propulsion Toolkit $VERSION"
          git push origin "$TAG"
          echo "Published $TAG. Install with https://github.com/${GITHUB_REPOSITORY}.git#$TAG" >> "$GITHUB_STEP_SUMMARY"
